<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кофі — ШІ-помічник</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5efe6;
      color: #3e2723;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
      overflow-x: hidden;
    }

    /* Приховуємо скролбар у міні-вікні */
    body::-webkit-scrollbar { width: 0px; background: transparent; }

    .assistant-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
      position: relative;
    }

    /* Кнопка налаштувань API ключа */
    .settings-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: #ede0d4;
      color: #5d4037;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .settings-btn:hover { background: #d7ccc8; }

    .thermos-box {
      position: relative;
      width: 135px;
      height: 175px;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 10px 15px rgba(62, 39, 35, 0.18));
    }
    .thermos-box:hover { transform: translateY(-3px) scale(1.03); }
    .thermos-box:active { transform: scale(0.97); }

    /* Анімація пари */
    .steam-path {
      fill: none;
      stroke: #a1887f;
      stroke-width: 3.5;
      stroke-linecap: round;
      opacity: 0;
      animation: steamRise 3s infinite ease-in-out;
    }
    .steam-1 { animation-delay: 0s; }
    .steam-2 { animation-delay: 1s; }
    .steam-3 { animation-delay: 2s; }

    @keyframes steamRise {
      0% { transform: translateY(8px); opacity: 0; }
      40% { opacity: 0.75; }
      80% { opacity: 0.3; }
      100% { transform: translateY(-16px); opacity: 0; }
    }

    .eye-group {
      transform-origin: center 115px;
      animation: blink 4.5s infinite;
    }
    @keyframes blink {
      0%, 95%, 100% { transform: scaleY(1); }
      97.5% { transform: scaleY(0.08); }
    }

    /* Хмаринка повідомлень */
    .speech-bubble {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(62, 39, 35, 0.08);
      width: 100%;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      margin: 8px 0 10px 0;
      position: relative;
      border: 1px solid #ede0d4;
      max-height: 110px;
      overflow-y: auto;
      user-select: text;
    }

    .card {
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(62, 39, 35, 0.07);
      width: 100%;
      border: 1px solid #ede0d4;
      margin-bottom: 8px;
    }
    .card.hidden { display: none; }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #8d6e63;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    input[type="text"], input[type="password"] {
      flex: 1;
      padding: 8px 10px;
      border: 1.5px solid #d7ccc8;
      border-radius: 10px;
      outline: none;
      font-size: 12.5px;
    }
    input:focus { border-color: #6f4e37; }

    button {
      background: #6f4e37;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12.5px;
    }
    button:hover { background: #5a3e2b; }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 110px;
      overflow-y: auto;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
      border-bottom: 1px solid #f4ebe1;
      font-size: 12.5px;
    }
    li.done span { text-decoration: line-through; opacity: 0.5; }
    .del-btn { background: transparent; color: #bcaaa4; padding: 2px 6px; }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .pip-btn { background: #37474f; width: 100%; padding: 9px; }
    .pip-btn:hover { background: #263238; }
    #installBtn { background: #2e7d32; display: none; width: 100%; padding: 9px; }
  </style>
</head>
<body>

  <div class="assistant-wrapper" id="mainWidget">
    <button class="settings-btn" onclick="toggleSettings()" title="Налаштування ШІ">⚙️</button>

    <!-- Відкрита термокружка -->
    <div class="thermos-box" onclick="toggleMenuAndPoke()" title="Натисни, щоб сховати/показати панель">
      <svg viewBox="0 0 160 210" width="100%" height="100%">
        <defs>
          <linearGradient id="cupBody" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3e2723"/>
            <stop offset="30%" stop-color="#5d4037"/>
            <stop offset="70%" stop-color="#4e342e"/>
            <stop offset="100%" stop-color="#2c1b18"/>
          </linearGradient>
          <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#90a4ae"/>
            <stop offset="35%" stop-color="#eceff1"/>
            <stop offset="70%" stop-color="#b0bec5"/>
            <stop offset="100%" stop-color="#607d8b"/>
          </linearGradient>
          <radialGradient id="coffeeLiquid" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4e342e"/>
            <stop offset="80%" stop-color="#26140e"/>
            <stop offset="100%" stop-color="#1a0d09"/>
          </radialGradient>
        </defs>

        <path class="steam-path steam-1" d="M 62 42 Q 54 30 62 18 T 62 -2" />
        <path class="steam-path steam-2" d="M 80 38 Q 88 24 80 12 T 80 -8" />
        <path class="steam-path steam-3" d="M 98 42 Q 90 30 98 18 T 98 -2" />

        <path d="M 122 82 L 138 82 Q 148 82 148 94 L 148 136 Q 148 148 138 148 L 118 148"
              fill="none" stroke="#37474f" stroke-width="11" stroke-linecap="round"/>
        <path d="M 122 82 L 138 82 Q 148 82 148 94 L 148 136 Q 148 148 138 148 L 118 148"
              fill="none" stroke="#546e7a" stroke-width="4" stroke-linecap="round"/>

        <path d="M 42 180 L 118 180 L 115 192 Q 114 198 106 198 L 54 198 Q 46 198 45 192 Z" fill="url(#metalRim)"/>
        <path d="M 32 64 L 128 64 L 118 182 L 42 182 Z" fill="url(#cupBody)"/>
        <path d="M 46 72 L 54 72 L 50 174 L 44 174 Z" fill="#ffffff" opacity="0.12"/>
        <path d="M 35 96 L 125 96 L 121 152 L 39 152 Z" fill="#d7ccc8" opacity="0.15"/>

        <ellipse cx="80" cy="64" rx="49" ry="13" fill="url(#metalRim)"/>
        <ellipse cx="80" cy="64" rx="43" ry="10" fill="#263238"/>
        <ellipse cx="80" cy="66" rx="40" ry="8.5" fill="url(#coffeeLiquid)"/>
        <path d="M 52 66 Q 80 71 108 66" fill="none" stroke="#a1887f" stroke-width="1.5" opacity="0.5"/>

        <g class="eye-group">
          <path d="M 52 100 Q 62 95 70 100" fill="none" stroke="#d7ccc8" stroke-width="3" stroke-linecap="round"/>
          <path d="M 90 100 Q 98 95 108 100" fill="none" stroke="#d7ccc8" stroke-width="3" stroke-linecap="round"/>
          <circle cx="62" cy="116" r="12" fill="#ffffff"/>
          <circle class="svg-pupil" data-cx="62" data-cy="116" cx="62" cy="116" r="5.5" fill="#1a1a1a"/>
          <circle cx="60" cy="113" r="2" fill="#ffffff"/>
          <circle cx="98" cy="116" r="12" fill="#ffffff"/>
          <circle class="svg-pupil" data-cx="98" data-cy="116" cx="98" cy="116" r="5.5" fill="#1a1a1a"/>
          <circle cx="96" cy="113" r="2" fill="#ffffff"/>
        </g>

        <ellipse cx="48" cy="128" rx="5" ry="3" fill="#ff8a80" opacity="0.45"/>
        <ellipse cx="112" cy="128" rx="5" ry="3" fill="#ff8a80" opacity="0.45"/>
        <path d="M 72 133 Q 80 141 88 133" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="speech-bubble" id="botMessage">
      Привіт! Я Кофі ☕ Запитай мене щось по роботі або додай завдання!
    </div>

    <!-- Налаштування API ключа -->
    <div class="card hidden" id="settingsCard">
      <div class="section-title">🔑 Ключ Gemini API</div>
      <div class="input-group" style="margin-bottom:0;">
        <input type="password" id="apiKeyInput" placeholder="Встав AIza...">
        <button onclick="saveApiKey()">Зберегти</button>
      </div>
    </div>

    <!-- Основна панель: ШІ-помічник + Справи -->
    <div id="panelsContainer" style="width:100%;">
      <div class="card">
        <div class="section-title">🤖 Запитати ШІ</div>
        <div class="input-group" style="margin-bottom:0;">
          <input type="text" id="aiPrompt" placeholder="Напиши лист, переклади, підкажи..." onkeypress="if(event.key==='Enter') askAI()">
          <button onclick="askAI()">➤</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">📝 Нагадування та справи</div>
        <div class="input-group">
          <input type="text" id="taskInput" placeholder="Не забути зробити..." onkeypress="if(event.key==='Enter') addTask()">
          <button onclick="addTask()">+</button>
        </div>
        <ul id="taskList"></ul>
      </div>
    </div>

    <div class="controls">
      <button class="pip-btn" id="pipBtn" onclick="openMiniWindow()">📌 Закріпити поверх усіх вікон</button>
      <button id="installBtn">⬇️ Встановити на комп'ютер</button>
    </div>
  </div>

  <script>
    // Очі стежать за курсором
    document.addEventListener('mousemove', (e) => {
      document.querySelectorAll('.svg-pupil').forEach(pupil => {
        const cx = parseFloat(pupil.getAttribute('data-cx'));
        const cy = parseFloat(pupil.getAttribute('data-cy'));
        const svg = pupil.closest('svg').getBoundingClientRect();
        const eyeScreenX = svg.left + (cx / 160) * svg.width;
        const eyeScreenY = svg.top + (cy / 210) * svg.height;
        const angle = Math.atan2(e.clientY - eyeScreenY, e.clientX - eyeScreenX);
        const dist = Math.min(3.5, Math.hypot(e.clientX - eyeScreenX, e.clientY - eyeScreenY) / 30);
        pupil.setAttribute('cx', cx + Math.cos(angle) * dist);
        pupil.setAttribute('cy', cy + Math.sin(angle) * dist);
      });
    });

    function toggleSettings() {
      const card = document.getElementById('settingsCard');
      card.classList.toggle('hidden');
      document.getElementById('apiKeyInput').value = localStorage.getItem('geminiApiKey') || '';
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('geminiApiKey', key);
      document.getElementById('settingsCard').classList.add('hidden');
      document.getElementById('botMessage').innerText = key ? "Ключ збережено! Тепер я готовий відповідати на запитання 🧠" : "Ключ очищено.";
    }

    // Запит до Gemini API
    async function askAI() {
      const promptInput = document.getElementById('aiPrompt');
      const text = promptInput.value.trim();
      if (!text) return;

      const apiKey = localStorage.getItem('geminiApiKey');
      if (!apiKey) {
        document.getElementById('botMessage').innerText = "Натисни ⚙️ у кутку та встав свій безкоштовний ключ Gemini API!";
        document.getElementById('settingsCard').classList.remove('hidden');
        return;
      }

      promptInput.value = '';
      document.getElementById('botMessage').innerText = "Думаю... ☕💭";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `Ти маленький дружній офісний помічник на ім'я Кофі (у вигляді термокружки з кавою). Відповідай українською мовою, коротко, по суті та корисно для роботи або навчання (до 3-4 речень). Запит користувача: ${text}` }]
            }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content) {
          document.getElementById('botMessage').innerText = data.candidates[0].content.parts[0].text;
        } else {
          document.getElementById('botMessage').innerText = "Помилка ключа або ліміту. Перевір налаштування ⚙️";
        }
      } catch (err) {
        document.getElementById('botMessage').innerText = "Не вдалося з'єднатися з ШІ. Перевір інтернет.";
      }
    }

    const phrases = [
      "Кава ще гаряча! Не забудь випити води 💧",
      "Перевір пошту та важливі повідомлення 📬",
      "Зроби паузу на 2 хвилини, розімни спину 🧘‍♀️",
      "Усе під контролем! Я нагадаю про справи 😉"
    ];

    function toggleMenuAndPoke() {
      document.getElementById('panelsContainer').classList.toggle('hidden');
      const msg = phrases[Math.floor(Math.random() * phrases.length)];
      document.getElementById('botMessage').innerText = msg;
    }

    // Список завдань
    let tasks = JSON.parse(localStorage.getItem('coffeeTasks')) || [];

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');
        li.innerHTML = `
          <span onclick="toggleTask(${index})" style="cursor:pointer; flex:1;">${task.done ? '✅' : '⬜'} ${task.text}</span>
          <button class="del-btn" onclick="deleteTask(${index})">✖</button>
        `;
        list.appendChild(li);
      });
      localStorage.setItem('coffeeTasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value.trim()) return;
      tasks.push({ text: input.value.trim(), done: false });
      input.value = '';
      document.getElementById('botMessage').innerText = "Записав! Тримаю під контролем ☕";
      renderTasks();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      if (tasks[index].done) document.getElementById('botMessage').innerText = "Чудово! Мінус одне завдання 🎉";
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    renderTasks();

    setInterval(() => {
      const activeTasks = tasks.filter(t => !t.done);
      if (activeTasks.length > 0) {
        document.getElementById('botMessage').innerText = `⏰ Нагадую! Невиконаних справ: ${activeTasks.length}`;
      }
    }, 40 * 60 * 1000);

    // Міні-вікно поверх усіх програм
    async function openMiniWindow() {
      if (!('documentPictureInPicture' in window)) return;
      try {
        const pipWindow = await documentPictureInPicture.requestWindow({ width: 280, height: 420 });
        [...document.styleSheets].forEach((styleSheet) => {
          try {
            const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
            const style = document.createElement('style');
            style.textContent = cssRules;
            pipWindow.document.head.appendChild(style);
          } catch (e) {}
        });

        const widget = document.getElementById('mainWidget');
        document.getElementById('pipBtn').style.display = 'none';
        pipWindow.document.body.append(widget);

        pipWindow.addEventListener('pagehide', () => {
          document.getElementById('pipBtn').style.display = 'block';
          document.body.append(widget);
        });
      } catch (err) {}
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBtn.style.display = 'none';
        deferredPrompt = null;
      }
    });
  </script>
</body>
</html>
