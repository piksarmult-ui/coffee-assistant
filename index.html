<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кофі (Coffee AI) — Офісний ШІ-помічник</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#b5651d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #fdf8f5, #efe4dc);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #1a1a1a;
    }
    .widget-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      max-width: 390px;
      width: 100%;
    }
    .bubble {
      width: 100%;
      background: #ffffff;
      border: 3px solid #141414;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 12px 28px rgba(20, 20, 20, 0.14);
      margin-bottom: 12px;
      transition: all 0.25s ease;
    }
    .bubble.hidden {
      opacity: 0;
      transform: translateY(15px) scale(0.95);
      pointer-events: none;
      height: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
      border: none;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 13px;
      color: #b5651d;
    }
    .msg-box {
      background: #faf6f2;
      border: 1.5px solid #e6d7cc;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13.5px;
      line-height: 1.45;
      min-height: 90px;
      max-height: 170px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    .msg-box::-webkit-scrollbar { width: 6px; }
    .msg-box::-webkit-scrollbar-thumb { background: #b5651d; border-radius: 3px; }
    .row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .row:last-child { margin-bottom: 0; }
    input[type="text"] {
      flex: 1;
      border: 2px solid #bcaaa4;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #b5651d; }
    button {
      background: #b5651d;
      color: #ffffff;
      border: 2px solid #141414;
      border-radius: 10px;
      padding: 7px 10px;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    button:hover { background: #965215; }
    button.btn-gray { background: #757575; }
    button.btn-light { background: #f5ebe0; color: #141414; }
    button.btn-light:hover { background: #eadbc8; }
    button.btn-install { background: #2e7d32; color: #ffffff; }
    button.btn-install:hover { background: #1b5e20; }
    .tasks-panel {
      display: none;
      background: #fdf9f6;
      border: 1.5px dashed #bcaaa4;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 8px;
      max-height: 130px;
      overflow-y: auto;
    }
    .tasks-panel.open { display: block; }
    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      padding: 4px 2px;
      border-bottom: 1px solid #eee;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item span { cursor: pointer; }
    .task-item.done span { text-decoration: line-through; color: #888; }
    .character-wrap {
      cursor: pointer;
      user-select: none;
      padding-right: 12px;
      animation: bounce 2s infinite ease-in-out;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.18));
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="bubble" id="bubble">
    <div class="header-bar">
      <span>☕ Кофі • ШІ-асистент</span>
      <span id="modelBadge" style="font-size: 11px; color: #757575;">Gemini 3.1 Lite</span>
    </div>

    <div class="msg-box" id="msgBox">Привіт! Я Кофі ☕ Тепер я пам’ятаю нашу розмову. Про що поспілкуємось?</div>

    <div class="tasks-panel" id="tasksPanel">
      <div class="row" style="margin-bottom: 6px;">
        <input type="text" id="taskInput" placeholder="Нова справа..." onkeydown="if(event.key==='Enter') addTask()" />
        <button onclick="addTask()">+</button>
      </div>
      <div id="tasksList"></div>
    </div>

    <div class="row">
      <input type="text" id="promptInput" placeholder="Напиши запитання..." onkeydown="if(event.key==='Enter') askAI()" />
      <button onclick="askAI()" title="Надіслати">➤</button>
    </div>

    <div class="row">
      <button onclick="analyzeScreen()" style="flex: 1;">👀 Що на екрані?</button>
      <button class="btn-light" onclick="toggleTasks()" title="Список справ">📋</button>
      <button class="btn-light" onclick="clearHistory()" title="Очистити пам'ять розмови">🧹</button>
      <button class="btn-install" id="installBtn" onclick="installPWA()" title="Встановити Кофі як застосунок на ПК чи телефон">📲 Встановити</button>
      <button class="btn-light" onclick="toggleBubble()" title="Сховати діалог">🔽</button>
    </div>
  </div>

  <div class="character-wrap" id="cupChar" onclick="toggleBubble()" title="Натисни, щоб відкрити або сховати Кофі">
    <svg width="86" height="118" viewBox="0 0 86 118" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 24 L70 24 L64 102 Q43 108 22 102 Z" fill="#ffffff" stroke="#141414" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M58 26 L68 26 L62 101 L54 102 Z" fill="#e0e0e0"/>
      <path d="M17 40 Q43 45 69 40 L66 84 Q43 89 20 84 Z" fill="#b5651d" stroke="#141414" stroke-width="2.8" stroke-linejoin="round"/>
      <line x1="60" y1="47" x2="58" y2="78" stroke="#e6a15c" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M14 16 L19 7 Q43 3 67 7 L72 16 Z" fill="#1c1c1c" stroke="#141414" stroke-width="2.8" stroke-linejoin="round"/>
      <rect x="11" y="15" width="64" height="10" rx="5" fill="#1c1c1c" stroke="#141414" stroke-width="2.8"/>
      <path d="M22 10 Q32 7 42 9" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="17" y1="20" x2="34" y2="20" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

      <path d="M26 42 Q32 38 39 42" fill="none" stroke="#141414" stroke-width="2.3" stroke-linecap="round"/>
      <path d="M47 42 Q54 38 60 42" fill="none" stroke="#141414" stroke-width="2.3" stroke-linecap="round"/>

      <line x1="28" y1="50" x2="23" y2="47" stroke="#141414" stroke-width="2.1" stroke-linecap="round"/>
      <line x1="27" y1="53" x2="21" y2="51" stroke="#141414" stroke-width="2.1" stroke-linecap="round"/>
      <line x1="27" y1="56" x2="22" y2="56" stroke="#141414" stroke-width="2.1" stroke-linecap="round"/>

      <line x1="58" y1="50" x2="63" y2="47" stroke="#141414" stroke-width="2.1" stroke-linecap="round"/>
      <line x1="59" y1="53" x2="65" y2="51" stroke="#141414" stroke-width="2.1" stroke-linecap="round"/>
      <line x1="59" y1="56" x2="64" y2="56" stroke="#141414" stroke-width="2.1" stroke-linecap="round"/>

      <ellipse cx="35.5" cy="57" rx="7.5" ry="11" fill="#ffffff" stroke="#141414" stroke-width="2.2"/>
      <ellipse cx="50.5" cy="57" rx="7.5" ry="11" fill="#ffffff" stroke="#141414" stroke-width="2.2"/>

      <g id="pupilL">
        <path d="M35.5 57 L31.5 53 A4.5 6.8 0 1 1 31.5 61 Z" fill="#141414"/>
      </g>
      <g id="pupilR">
        <path d="M50.5 57 L46.5 53 A4.5 6.8 0 1 1 46.5 61 Z" fill="#141414"/>
      </g>

      <path d="M31 71 Q43 80 55 71" fill="none" stroke="#141414" stroke-width="2.3" stroke-linecap="round"/>
      <path d="M30 69 Q28 71 30 73" fill="none" stroke="#141414" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M56 69 Q58 71 56 73" fill="none" stroke="#141414" stroke-width="2.1" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<script>
  const PROXY_URL = 'https://gentle-base-e6e8coffee-proxy.piksarmult.workers.dev';
  const TASKS_KEY = 'coffee_ai_tasks_v2';
  const SYSTEM_RULE = 'Ти дружній офісний ШІ-помічник Кофі. Продовжуй поточний діалог природно українською мовою. НІКОЛИ не вітайся знову ("Привіт", "Я Кофі") — відповідай одразу по суті запитання.';

  let chatHistory = [];
  let deferredPrompt = null;
  let lastMouseMove = Date.now();
  const pupilL = document.getElementById('pupilL');
  const pupilR = document.getElementById('pupilR');
  const cupChar = document.getElementById('cupChar');
  const installBtn = document.getElementById('installBtn');

  // Реєстрація Service Worker для PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // Перехоплення події встановлення PWA
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-flex';
  });

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    installBtn.style.display = 'none';
    document.getElementById('msgBox').textContent = 'Ура! Кофі встановлено як окремий застосунок 🎉';
  });

  // Якщо вже запущено як встановлений PWA-застосунок — ховаємо кнопку встановлення
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
    installBtn.style.display = 'none';
  }

  async function installPWA() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    } else {
      document.getElementById('msgBox').textContent =
        'Щоб встановити Кофі як застосунок:\n• У Chrome / Edge: натисни іконку монітора зі стрілкою (⊕) у правому кінці адресного рядка або Меню (⋮) → «Встановити Кофі».\n• На iPhone / Safari: натисни «Поділитися» → «На екран Початок».';
    }
  }

  function movePupils(dx, dy) {
    pupilL.setAttribute('transform', `translate(${dx.toFixed(1)}, ${dy.toFixed(1)})`);
    pupilR.setAttribute('transform', `translate(${dx.toFixed(1)}, ${dy.toFixed(1)})`);
  }

  document.addEventListener('mousemove', (e) => {
    lastMouseMove = Date.now();
    const rect = cupChar.getBoundingClientRect();
    const eyeCenterX = rect.left + rect.width * 0.5;
    const eyeCenterY = rect.top + rect.height * 0.49;

    const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
    const dist = Math.min(2.6, Math.hypot(e.clientX - eyeCenterX, e.clientY - eyeCenterY) / 45);
    movePupils(Math.cos(angle) * dist, Math.sin(angle) * dist * 1.2);
  });

  setInterval(() => {
    if (Date.now() - lastMouseMove > 2200) {
      const positions = [
        [-2.4, -0.5], [2.4, -0.5], [0, -2.2], [-2.0, 1.5], [2.0, 1.5], [0, 0]
      ];
      const [rx, ry] = positions[Math.floor(Math.random() * positions.length)];
      movePupils(rx, ry);
    }
  }, 1100);

  window.onload = () => {
    localStorage.removeItem('coffee_ai_gemini_key');
    renderTasks();
  };

  function toggleBubble() {
    document.getElementById('bubble').classList.toggle('hidden');
  }

  function clearHistory() {
    chatHistory = [];
    document.getElementById('msgBox').textContent = 'Пам’ять розмови очищено 🧹 Про що поговоримо далі?';
  }

  async function callGemini(userText, base64Image = null) {
    const userParts = [{ text: userText }];
    if (base64Image) {
      userParts.push({ inline_data: { mime_type: 'image/jpeg', data: base64Image } });
    }

    chatHistory.push({ role: 'user', parts: [{ text: userText }] });
    if (chatHistory.length > 14) chatHistory = chatHistory.slice(-14);

    const contents = [
      { role: 'user', parts: [{ text: SYSTEM_RULE }] },
      { role: 'model', parts: [{ text: 'Зрозумів, відповідаю одразу по суті без зайвих привітань.' }] },
      ...chatHistory.slice(0, -1),
      { role: 'user', parts: userParts }
    ];

    try {
      const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents })
      });
      const data = await res.json();
      if (res.ok && data.text) {
        const reply = data.text.replace(/\*\*/g, '').trim();
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        if (data.model) {
          document.getElementById('modelBadge').textContent = data.model.replace('-preview', '');
        }
        document.getElementById('msgBox').textContent = reply;
      } else {
        chatHistory.pop();
        document.getElementById('msgBox').textContent = 'Помилка: ' + (data.error || 'Сервер не відповів');
      }
    } catch (e) {
      chatHistory.pop();
      document.getElementById('msgBox').textContent = 'Помилка з’єднання: ' + e.message;
    }
  }

  function askAI() {
    const input = document.getElementById('promptInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    document.getElementById('msgBox').textContent = 'Думаю... ⚡';
    callGemini(text);
  }

  async function analyzeScreen() {
    try {
      document.getElementById('msgBox').textContent = 'Вибери вкладку або вікно для перевірки... 👀';
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const video = document.createElement('video');
      video.srcObject = stream;
      await video.play();

      const canvas = document.createElement('canvas');
      const scale = Math.min(1, 1280 / video.videoWidth);
      canvas.width = video.videoWidth * scale;
      canvas.height = video.videoHeight * scale;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

      stream.getTracks().forEach(t => t.stop());
      const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

      document.getElementById('msgBox').textContent = 'Швидко дивлюся на екран... ⚡👀';
      await callGemini('Подивись на мій екран: якщо є помилка — коротко вкажи її. Інакше дай 1 коротку пораду (до 2 речень).', base64);
    } catch (e) {
      document.getElementById('msgBox').textContent = 'Перевірку екрана скасовано.';
    }
  }

  function toggleTasks() { document.getElementById('tasksPanel').classList.toggle('open'); }
  function getTasks() { return JSON.parse(localStorage.getItem(TASKS_KEY) || '[]'); }
  function addTask() {
    const inp = document.getElementById('taskInput');
    const txt = inp.value.trim();
    if (!txt) return;
    const tasks = getTasks();
    tasks.push({ text: txt, done: false });
    localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
    inp.value = '';
    renderTasks();
  }
  function toggleTaskDone(idx) {
    const tasks = getTasks();
    tasks[idx].done = !tasks[idx].done;
    localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
    renderTasks();
  }
  function removeTask(idx) {
    const tasks = getTasks();
    tasks.splice(idx, 1);
    localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
    renderTasks();
  }
  function renderTasks() {
    const list = document.getElementById('tasksList');
    const tasks = getTasks();
    if (!tasks.length) {
      list.innerHTML = '<div style="font-size:12px; color:#888; text-align:center;">Справ поки немає ☕</div>';
      return;
    }
    list.innerHTML = tasks.map((t, i) => `
      <div class="task-item ${t.done ? 'done' : ''}">
        <span onclick="toggleTaskDone(${i})">${t.done ? '✅' : '⬜'} ${t.text}</span>
        <button class="btn-gray" style="padding:2px 6px; font-size:10px;" onclick="removeTask(${i})">✖</button>
      </div>
    `).join('');
  }
</script>
</body>
</html>
