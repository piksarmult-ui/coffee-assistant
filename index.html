<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кофі — Офісний помічник</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5efe6;
      color: #3e2723;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      user-select: none;
    }

    /* Контейнер персонажа */
    .assistant-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
    }

    .thermos-box {
      position: relative;
      width: 150px;
      height: 195px;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 12px 18px rgba(62, 39, 35, 0.18));
    }
    .thermos-box:hover {
      transform: translateY(-4px) scale(1.03);
    }
    .thermos-box:active {
      transform: scale(0.97);
    }

    /* Анімація хвилястої пари */
    .steam-path {
      fill: none;
      stroke: #a1887f;
      stroke-width: 3.5;
      stroke-linecap: round;
      opacity: 0;
      animation: steamRise 3s infinite ease-in-out;
    }
    .steam-1 { animation-delay: 0s; }
    .steam-2 { animation-delay: 1s; }
    .steam-3 { animation-delay: 2s; }

    @keyframes steamRise {
      0% { transform: translateY(8px); opacity: 0; }
      40% { opacity: 0.75; }
      80% { opacity: 0.3; }
      100% { transform: translateY(-16px); opacity: 0; }
    }

    /* Кліпання очима */
    .eye-group {
      transform-origin: center 115px;
      animation: blink 4.5s infinite;
    }
    @keyframes blink {
      0%, 95%, 100% { transform: scaleY(1); }
      97.5% { transform: scaleY(0.08); }
    }

    /* Хмаринка повідомлень */
    .speech-bubble {
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(62, 39, 35, 0.08);
      width: 100%;
      text-align: center;
      font-size: 13.5px;
      line-height: 1.4;
      margin: 10px 0 12px 0;
      position: relative;
      border: 1px solid #ede0d4;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 8px solid #ffffff;
    }

    /* Панель завдань (згортається при кліку на кружку) */
    .card {
      background: #ffffff;
      padding: 14px;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(62, 39, 35, 0.07);
      width: 100%;
      border: 1px solid #ede0d4;
      transition: all 0.3s ease;
    }
    .card.hidden {
      display: none;
    }

    .input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid #d7ccc8;
      border-radius: 10px;
      outline: none;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #6f4e37;
    }
    button {
      background: #6f4e37;
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover { background: #5a3e2b; }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 150px;
      overflow-y: auto;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 4px;
      border-bottom: 1px solid #f4ebe1;
      font-size: 13px;
    }
    li:last-child { border-bottom: none; }
    li.done span { text-decoration: line-through; opacity: 0.5; }
    .del-btn { background: transparent; color: #bcaaa4; padding: 2px 6px; }
    .del-btn:hover { background: #fbe9e7; color: #d84315; }

    /* Кнопки керування */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
    }
    .pip-btn {
      background: #37474f;
      width: 100%;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .pip-btn:hover { background: #263238; }

    #installBtn {
      background: #2e7d32;
      display: none;
      width: 100%;
      padding: 10px;
    }
    #installBtn:hover { background: #1b5e20; }
  </style>
</head>
<body>

  <div class="assistant-wrapper" id="mainWidget">
    <!-- Відкрита термокружка з парою (SVG) -->
    <div class="thermos-box" onclick="toggleMenuAndPoke()" title="Натисни на мене, щоб сховати/показати справи!">
      <svg viewBox="0 0 160 210" width="100%" height="100%">
        <defs>
          <!-- Градієнт корпусу термокружки -->
          <linearGradient id="cupBody" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3e2723"/>
            <stop offset="30%" stop-color="#5d4037"/>
            <stop offset="70%" stop-color="#4e342e"/>
            <stop offset="100%" stop-color="#2c1b18"/>
          </linearGradient>
          <!-- Градієнт металевого обідка та дна -->
          <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#90a4ae"/>
            <stop offset="35%" stop-color="#eceff1"/>
            <stop offset="70%" stop-color="#b0bec5"/>
            <stop offset="100%" stop-color="#607d8b"/>
          </linearGradient>
          <!-- Градієнт гарячої кави всередині -->
          <radialGradient id="coffeeLiquid" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4e342e"/>
            <stop offset="80%" stop-color="#26140e"/>
            <stop offset="100%" stop-color="#1a0d09"/>
          </radialGradient>
        </defs>

        <!-- Хвиляста пара -->
        <path class="steam-path steam-1" d="M 62 42 Q 54 30 62 18 T 62 -2" />
        <path class="steam-path steam-2" d="M 80 38 Q 88 24 80 12 T 80 -8" />
        <path class="steam-path steam-3" d="M 98 42 Q 90 30 98 18 T 98 -2" />

        <!-- Ручка термокружки -->
        <path d="M 122 82 L 138 82 Q 148 82 148 94 L 148 136 Q 148 148 138 148 L 118 148"
              fill="none" stroke="#37474f" stroke-width="11" stroke-linecap="round"/>
        <path d="M 122 82 L 138 82 Q 148 82 148 94 L 148 136 Q 148 148 138 148 L 118 148"
              fill="none" stroke="#546e7a" stroke-width="4" stroke-linecap="round"/>

        <!-- Металеве дно -->
        <path d="M 42 180 L 118 180 L 115 192 Q 114 198 106 198 L 54 198 Q 46 198 45 192 Z" fill="url(#metalRim)"/>

        <!-- Основний корпус термокружки -->
        <path d="M 32 64 L 128 64 L 118 182 L 42 182 Z" fill="url(#cupBody)"/>

        <!-- Вертикальний блік на корпусі -->
        <path d="M 46 72 L 54 72 L 50 174 L 44 174 Z" fill="#ffffff" opacity="0.12"/>

        <!-- Силіконовий манжет (поясок) -->
        <path d="M 35 96 L 125 96 L 121 152 L 39 152 Z" fill="#d7ccc8" opacity="0.15"/>

        <!-- Відкритий верхній металевий обідок -->
        <ellipse cx="80" cy="64" rx="49" ry="13" fill="url(#metalRim)"/>
        <!-- Внутрішня частина горлечка (відкрита кришка) -->
        <ellipse cx="80" cy="64" rx="43" ry="10" fill="#263238"/>
        <!-- Гаряча кава всередині -->
        <ellipse cx="80" cy="66" rx="40" ry="8.5" fill="url(#coffeeLiquid)"/>
        <!-- Пінка / блік на каві -->
        <path d="M 52 66 Q 80 71 108 66" fill="none" stroke="#a1887f" stroke-width="1.5" opacity="0.5"/>

        <!-- Обличчя: Очі та Брови -->
        <g class="eye-group">
          <!-- Брови -->
          <path d="M 52 100 Q 62 95 70 100" fill="none" stroke="#d7ccc8" stroke-width="3" stroke-linecap="round"/>
          <path d="M 90 100 Q 98 95 108 100" fill="none" stroke="#d7ccc8" stroke-width="3" stroke-linecap="round"/>

          <!-- Ліве око -->
          <circle cx="62" cy="116" r="12" fill="#ffffff"/>
          <circle class="svg-pupil" data-cx="62" data-cy="116" cx="62" cy="116" r="5.5" fill="#1a1a1a"/>
          <circle cx="60" cy="113" r="2" fill="#ffffff"/>

          <!-- Праве око -->
          <circle cx="98" cy="116" r="12" fill="#ffffff"/>
          <circle class="svg-pupil" data-cx="98" data-cy="116" cx="98" cy="116" r="5.5" fill="#1a1a1a"/>
          <circle cx="96" cy="113" r="2" fill="#ffffff"/>
        </g>

        <!-- Рум'янець -->
        <ellipse cx="48" cy="128" rx="5" ry="3" fill="#ff8a80" opacity="0.45"/>
        <ellipse cx="112" cy="128" rx="5" ry="3" fill="#ff8a80" opacity="0.45"/>

        <!-- Усмішка -->
        <path d="M 72 133 Q 80 141 88 133" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="speech-bubble" id="botMessage">
      Привіт! Я твій термо-Кофі ☕ Натисни на мене, щоб сховати список, або закріпи мене поверх вікон!
    </div>

    <div class="card" id="taskCard">
      <div class="input-group">
        <input type="text" id="taskInput" placeholder="Що потрібно не забути?..." onkeypress="if(event.key==='Enter') addTask()">
        <button onclick="addTask()">+</button>
      </div>
      <ul id="taskList"></ul>
    </div>

    <div class="controls">
      <button class="pip-btn" id="pipBtn" onclick="openMiniWindow()">📌 Закріпити кружку поверх усіх вікон</button>
      <button id="installBtn">⬇️ Встановити на комп'ютер</button>
    </div>
  </div>

  <script>
    // Слідкування зіниць у SVG за курсором
    document.addEventListener('mousemove', (e) => {
      document.querySelectorAll('.svg-pupil').forEach(pupil => {
        const cx = parseFloat(pupil.getAttribute('data-cx'));
        const cy = parseFloat(pupil.getAttribute('data-cy'));
        const svg = pupil.closest('svg').getBoundingClientRect();
        const eyeScreenX = svg.left + (cx / 160) * svg.width;
        const eyeScreenY = svg.top + (cy / 210) * svg.height;

        const angle = Math.atan2(e.clientY - eyeScreenY, e.clientX - eyeScreenX);
        const dist = Math.min(3.5, Math.hypot(e.clientX - eyeScreenX, e.clientY - eyeScreenY) / 30);

        pupil.setAttribute('cx', cx + Math.cos(angle) * dist);
        pupil.setAttribute('cy', cy + Math.sin(angle) * dist);
      });
    });

    // Клік по термокружці: зміна фрази та згортання/розгортання списку
    const phrases = [
      "Кава ще гаряча! А ти не забула випити води? 💧",
      "Перевір пошту та важливі повідомлення 📬",
      "Зроби паузу на 2 хвилини, розімни спину 🧘‍♀️",
      "Натисни кнопку нижче, щоб я висів поверх усіх вікон 📌",
      "Усе під контролем! Я нагадаю про справи 😉"
    ];

    function toggleMenuAndPoke() {
      const card = document.getElementById('taskCard');
      card.classList.toggle('hidden');
      const msg = phrases[Math.floor(Math.random() * phrases.length)];
      document.getElementById('botMessage').innerText = msg;
    }

    // Список завдань
    let tasks = JSON.parse(localStorage.getItem('coffeeTasks')) || [];

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');
        li.innerHTML = `
          <span onclick="toggleTask(${index})" style="cursor:pointer; flex:1;">${task.done ? '✅' : '⬜'} ${task.text}</span>
          <button class="del-btn" onclick="deleteTask(${index})">✖</button>
        `;
        list.appendChild(li);
      });
      localStorage.setItem('coffeeTasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value.trim()) return;
      tasks.push({ text: input.value.trim(), done: false });
      input.value = '';
      document.getElementById('botMessage').innerText = "Записав! Тримаю під контролем ☕";
      renderTasks();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      if (tasks[index].done) {
        document.getElementById('botMessage').innerText = "Чудово! Мінус одне завдання 🎉";
      }
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    renderTasks();

    // Нагадування кожні 40 хвилин
    setInterval(() => {
      const activeTasks = tasks.filter(t => !t.done);
      if (activeTasks.length > 0) {
        document.getElementById('botMessage').innerText = `⏰ Нагадую! Невиконаних справ: ${activeTasks.length}`;
      }
    }, 40 * 60 * 1000);

    // Режим міні-вікна поверх усіх програм (Document Picture-in-Picture)
    async function openMiniWindow() {
      if (!('documentPictureInPicture' in window)) {
        document.getElementById('botMessage').innerText = "Просто зменш розмір цього вікна мишкою і перетягни в куток екрана!";
        return;
      }
      try {
        const pipWindow = await documentPictureInPicture.requestWindow({
          width: 240,
          height: 310
        });

        // Копіюємо стилі у міні-вікно
        [...document.styleSheets].forEach((styleSheet) => {
          try {
            const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
            const style = document.createElement('style');
            style.textContent = cssRules;
            pipWindow.document.head.appendChild(style);
          } catch (e) {}
        });

        const widget = document.getElementById('mainWidget');
        document.getElementById('taskCard').classList.add('hidden');
        document.getElementById('pipBtn').style.display = 'none';
        pipWindow.document.body.append(widget);

        // Повертаємо назад при закритті міні-вікна
        pipWindow.addEventListener('pagehide', () => {
          document.getElementById('pipBtn').style.display = 'flex';
          document.body.append(widget);
        });
      } catch (err) {
        document.getElementById('botMessage').innerText = "Зменш це вікно за куточок і постав збоку екрана ☕";
      }
    }

    // PWA встановлення
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBtn.style.display = 'none';
        deferredPrompt = null;
      }
    });
  </script>
</body>
</html>
